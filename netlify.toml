[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."*"]
  timeout = 26

# Recordatorios de turno: se revisa cada 15 min quién tiene algo por empezar.
[functions."recordatorios"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
